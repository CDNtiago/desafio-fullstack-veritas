name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format
        shell: bash
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Race detection
        if: runner.os == 'Linux'
        working-directory: backend
        run: go test -race ./...
      - name: Vulnerability analysis
        if: runner.os == 'Linux'
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install and check
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Real API end-to-end tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start
        run: docker compose up --build -d --wait
      - name: Smoke test and persistence
        shell: bash
        run: |
          curl --fail http://localhost:5173/ > /dev/null
          curl --fail http://localhost:8080/health
          TASK=$(curl --fail -s -H 'Content-Type: application/json' -d '{"title":"CI persistence"}' http://localhost:8080/tasks)
          ID=$(echo "$TASK" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          docker compose restart backend
          docker compose up -d --wait
          curl --fail -s http://localhost:8080/tasks | python3 -c 'import json,sys; assert any(t["title"] == "CI persistence" for t in json.load(sys.stdin))'
          curl --fail -X DELETE "http://localhost:8080/tasks/$ID"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop isolated CI services
        if: always()
        run: docker compose down --volumes
